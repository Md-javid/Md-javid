<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 420" width="490" height="420" class="info-card">
  <defs>
    <style>
      .info-card {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: #0B0F19;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
      }
      .terminal-bar {
        fill: #94A3B8;
        font-size: 12px;
        font-weight: 600;
      }
      .row {
        font-size: 11.5px;
        opacity: 0;
        transform: translateY(6px);
        animation: rowFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .user-title {
        font-size: 13.5px;
      }
      @keyframes rowFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" rx="16" fill="#0B0F19" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Terminal Window Bar -->
