<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 420" width="370" height="420" class="ascii-card">
  <defs>
    <style>
      .ascii-card {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background: #0B0F19;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
      }
      .terminal-bar {
        fill: #94A3B8;
        font-size: 12px;
        font-weight: 600;
      }
      .ascii-row {
        fill: #F0B87E;
        font-size: 8.8px;
        letter-spacing: 1px;
        white-space: pre;
        opacity: 0;
        animation: typeRow 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes typeRow {
        0% {
          opacity: 0;
          transform: translateY(2px);
        }
        100% {
          opacity: 0.92;
          transform: translateY(0);
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="#0B0F19" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="24" r="4.5" fill="#EF4444" opacity="0.8"/>
  <circle cx="39" cy="24" r="4.5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="54" cy="24" r="4.5" fill="#10B981" opacity="0.8"/>
  <text x="74" y="28" class="terminal-bar">javid@ascii-portrait: ~</text>

  <!-- ASCII Lines -->
