name: 📊 Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    name: Refresh Contribution Heatmap
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🔄 Scrape Live Contributions
        run: python scripts/fetch_contributions.py

      - name: 🎨 Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: 💾 Commit & Push Updated Art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh live contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
